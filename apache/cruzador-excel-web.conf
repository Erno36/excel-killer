<VirtualHost *:80>
    ServerName localhost

    <Location />
        Require local
    </Location>

    Redirect permanent / https://localhost/
</VirtualHost>

<VirtualHost *:443>
    ServerName localhost

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/cruzador-excel-web.crt
    SSLCertificateKeyFile /etc/ssl/private/cruzador-excel-web.key

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 120
    LimitRequestBody 44040192

    RequestHeader set X-Forwarded-Proto "https"

    <Location />
        Require local
    </Location>

    ProxyPass / http://127.0.0.1:8000/ retry=0
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog ${APACHE_LOG_DIR}/cruzador-excel-web-error.log
    CustomLog ${APACHE_LOG_DIR}/cruzador-excel-web-access.log combined
</VirtualHost>
